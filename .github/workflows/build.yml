name: build profile

on:
  schedule:
    - cron: '17 3 * * *'      # daily 03:17 UTC — off-peak, shorter runner queue
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'preview/**'

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit step rebases when main has moved, and a
          # depth-1 stub has nothing to rebase onto.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci` — the generator has zero dependencies on purpose.

      - name: fetch contributions
        env:
          # GH_PAT (classic, scope read:user) also picks up PRIVATE contributions
          # when "Include private contributions on my profile" is enabled.
          # Falls back to the built-in token, which sees public data only.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: npm run fetch

      - name: render SVGs
        run: npm run render

      # run_id, not run_number: run_number starts at 1 and can collide with a
      # hand-stamped value, producing no diff and leaving camo on a cached 404.
      - name: bust camo cache in README
        run: npm run stamp -- ${{ github.run_id }}

      # Publish BEFORE the bookkeeping commit. The SVGs are what the README and
      # the portfolio actually read; a push race on main must never cost a day's
      # artwork, which is exactly what happened when this ran last.
      # Force-pushed single-commit branch, so the SVGs never grow main's history.
      - name: publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit data + README
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          git diff --quiet --cached && { echo "no data change"; exit 0; }
          git commit -m "chore: daily extraction [skip ci]"
          # main can move between checkout and push — a manual push, or the
          # previous scheduled run landing late. The payload is regenerated
          # data, never a conflict a human needs to resolve, so rebase onto
          # whatever arrived and try again instead of failing the build.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || true
          done
          echo "::error::could not push after 3 attempts"
          exit 1
