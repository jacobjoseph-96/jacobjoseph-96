name: build profile

on:
  schedule:
    - cron: '17 3 * * *'      # daily 03:17 UTC — off-peak, shorter runner queue
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'preview/**'

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit step rebases when main has moved, and a
          # depth-1 stub has nothing to rebase onto.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci` — the generator has zero dependencies on purpose.

      - name: fetch contributions
        env:
          # GH_PAT (classic, scope read:user) also picks up PRIVATE contributions
          # when "Include private contributions on my profile" is enabled.
          # Falls back to the built-in token, which sees public data only.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: npm run fetch

      - name: render SVGs
        run: npm run render

      # run_id, not run_number: run_number starts at 1 and can collide with a
      # hand-stamped value, producing no diff and leaving camo on a cached 404.
      - name: bust camo cache in README
        run: npm run stamp -- ${{ github.run_id }}

      # Publish BEFORE the bookkeeping commit. The SVGs are what the README and
      # the portfolio actually read; a push race on main must never cost a day's
      # artwork, which is exactly what happened when this ran last.
      # Force-pushed single-commit branch, so the SVGs never grow main's history.
      - name: publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit data + README
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The payload is a full regeneration, not a patch, so park it outside
          # the work tree — it has to survive the reset each attempt makes.
          payload="$(mktemp -d)"
          cp -r data "$payload/data"
          cp README.md "$payload/README.md"

          for attempt in 1 2 3; do
            # Rebase onto whatever main is NOW, not onto what checkout saw.
            # "Re-run jobs" replays at the ORIGINAL run's SHA, so the checked-out
            # tip can be a day stale and the first push is rejected every time.
            # -B also recovers a detached HEAD left by an earlier attempt.
            git fetch -q origin main
            git checkout -qB main origin/main

            # Re-lay the payload; never merge it. Regenerated JSON conflicts
            # with regenerated JSON on essentially every line, so `pull --rebase`
            # here does not "try again", it halts mid-rebase and strands the
            # repo on a detached HEAD with unmerged files — which is exactly
            # what burned the 2026-07-29 run. The only resolution anyone wants
            # is "the file we just generated". Copying says that; rebase cannot.
            rm -rf data
            cp -r "$payload/data" data
            cp "$payload/README.md" README.md

            git add data README.md
            if git diff --quiet --cached; then echo "no data change"; exit 0; fi
            git commit -q -m "chore: daily extraction [skip ci]"
            if git push -q origin main; then exit 0; fi
            echo "push rejected (attempt $attempt) — re-laying onto the new tip"
          done
          echo "::error::could not push after 3 attempts"
          exit 1
